[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cstr-rlpd-lab"
version = "0.1.0"
description = "CSTR-only simulation, RLPD training, evaluation, and browser HMI"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
  "numpy>=1.24",
  "gymnasium>=0.29",
]

[project.optional-dependencies]
train = [
  "torch>=2.2",
  "onnx>=1.16",
  "onnxruntime>=1.17",
]
test = ["pytest>=8.0"]

[tool.setuptools]
packages = ["cstrlab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
